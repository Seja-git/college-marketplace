{% extends "base.html" %}

{% block title %}
edit_item
{% endblock %}

{% block content %}
   <body>

    <h1>Edit Item</h1>

    <form method="POST">

        <input
            type="text"
            name="title"
            value="{{ item.title }}"
        >

        <br><br>

        <textarea
            name="description"
        >{{ item.description }}</textarea>

        <br><br>

        <input
            type="number"
            name="price"
            value="{{ item.price }}"
        >

        <br><br>

        <input
            type="text"
            name="category"
            value="{{ item.category }}"
        >

        <br><br>

        <button type="submit">
            Save Changes
        </button>

    </form>

</body>

{% endblock %}
