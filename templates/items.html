{% extends "base.html" %}

{% block title %}
College Marketplace
{% endblock %}

{% block content %}
   <body>

    <h1>College Marketplace</h1>

    {% for item in items %}

        <h3>
          <a href="/item/{{ item.id }}">
        {{ item.title }}
        </a>
        </h3>

        <p>{{ item.description }}</p>

        <p>Price: ₹{{ item.price }}</p>

        <p>Category: {{ item.category }}</p>

        <hr>

    {% endfor %}

</body>

{% endblock %}
