{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

<h2>Review {{ reviewed_user.username }}</h2>

<form method="POST">

<div class="mb-3">

<label class="form-label">

Rating

</label>

<select

name="rating"

class="form-select">

<option value="5">★★★★★</option>

<option value="4">★★★★☆</option>

<option value="3">★★★☆☆</option>

<option value="2">★★☆☆☆</option>

<option value="1">★☆☆☆☆</option>

</select>

</div>

<div class="mb-3">

<label>

Comment

</label>

<textarea

name="comment"

class="form-control"

rows="4">

</textarea>

</div>

<button

class="btn btn-success">

Submit Review

</button>

</form>

</div>

{% endblock %}
