<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Marketplace Copilot</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f6f8;

        }


        .container {

            width: 700px;

            max-width: 92%;

            margin: 50px auto;

            background: white;

            border-radius: 12px;

            padding: 25px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.08);

        }


        h1 {

            margin-top: 0;

            margin-bottom: 5px;

        }


        .subtitle {

            color: #666;

            margin-bottom: 20px;

        }


        #chat-box {

            height: 400px;

            overflow-y: auto;

            border: 1px solid #ddd;

            border-radius: 10px;

            padding: 15px;

            margin-bottom: 15px;

            background: #fafafa;

        }


        .message {

            margin-bottom: 15px;

            padding: 10px 14px;

            border-radius: 10px;

            max-width: 80%;

            line-height: 1.5;

            white-space: pre-wrap;

        }


        .user {

            background: #e8f0fe;

            margin-left: auto;

        }


        .assistant {

            background: #eeeeee;

            margin-right: auto;

        }


        .input-area {

            display: flex;

            gap: 10px;

        }


        #message {

            flex: 1;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

        }


        button {

            padding: 12px 20px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            background: #222;

            color: white;

        }


        button:disabled {

            background: #999;

            cursor: not-allowed;

        }

    </style>

</head>


<body>


<div class="container">

    <h1>
        AI Marketplace Copilot
    </h1>


    <div class="subtitle">

        Your assistant for the college marketplace

    </div>


    <div id="chat-box">

        <div class="message assistant">

            Hi! I'm your Marketplace Copilot.
            How can I help you today?

        </div>

    </div>


    <div class="input-area">

        <input
            type="text"
            id="message"
            placeholder="Ask your marketplace question..."
        >


        <button
            id="send-button"
            onclick="sendMessage()"
        >

            Send

        </button>

    </div>

</div>


<script>


async function sendMessage() {


    const input =
        document.getElementById("message");


    const button =
        document.getElementById("send-button");


    const chatBox =
        document.getElementById("chat-box");


    const message =
        input.value.trim();


    if (!message) {

        return;

    }


    // Display user message

    const userMessage =
        document.createElement("div");


    userMessage.className =
        "message user";


    userMessage.textContent =
        message;


    chatBox.appendChild(
        userMessage
    );


    input.value = "";


    button.disabled = true;

    button.textContent =
        "Thinking...";


    try {


        const response =
            await fetch(
                "/copilot/chat",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })

                }
            );


        const data =
            await response.json();


        if (data.success) {


            const assistantMessage =
                document.createElement("div");


            assistantMessage.className =
                "message assistant";


            assistantMessage.textContent =
                data.response;


            chatBox.appendChild(
                assistantMessage
            );


        } else {


            const errorMessage =
                document.createElement("div");


            errorMessage.className =
                "message assistant";


            errorMessage.textContent =
                data.error ||
                "Something went wrong.";


            chatBox.appendChild(
                errorMessage
            );

        }


    } catch (error) {


        console.error(error);


        const errorMessage =
            document.createElement("div");


        errorMessage.className =
            "message assistant";


        errorMessage.textContent =
            "Unable to connect to the Copilot.";


        chatBox.appendChild(
            errorMessage
        );

    }


    button.disabled = false;

    button.textContent =
        "Send";


    chatBox.scrollTop =
        chatBox.scrollHeight;

}


// Press Enter to send

document
    .getElementById("message")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                sendMessage();

            }

        }
    );


</script>


</body>

</html>
