
{% extends "base.html" %}

{% block title %}
Add Item
{% endblock %}

{% block content %}

<div class="container mt-4" style="max-width:700px;">

    <h2 class="mb-4">Add New Item</h2>

    <form method="POST" enctype="multipart/form-data">

        <!-- Image -->

        <div class="mb-3">

            <label class="form-label">
                Product Image
            </label>

            <input
                type="file"
                name="image"
                class="form-control"
                accept="image/*"
                required>

        </div>

        <!-- Title -->

        <div class="mb-3">

            <label class="form-label">
                Title
            </label>

            <input
                type="text"
                id="title"
                name="title"
                class="form-control"
                required>

        </div>

        <!-- Price -->

        <div class="mb-3">

            <label class="form-label">
                Price (₹)
            </label>

            <input
                type="number"
                id="price"
                name="price"
                class="form-control"
                required>

        </div>

        <!-- Category -->

        <div class="mb-3">

            <label class="form-label">
                Category
            </label>

            <select
                id="category"
                name="category"
                class="form-select"
                required>

                <option value="">
                    Select Category
                </option>

                {% for category in categories %}

                <option value="{{ category }}">
                    {{ category }}
                </option>

                {% endfor %}

            </select>

        </div>

        <!-- AI INPUT -->

        <div class="mb-3">

            <label class="form-label">

                Important Points / Keywords

            </label>

            <textarea
                id="details"
                class="form-control"
                rows="5"
                placeholder="Example:

• Used only one semester

• USB cable included

• Reason for selling: Course completed

• Minor scratches

• Works perfectly"></textarea>

            <div class="form-text">
                Mention anything you want the AI to include in the description.
            </div>

        </div>

        <!-- Generate Button -->

        <div class="mb-3">

            <button
                type="button"
                id="generate-btn"
                class="btn btn-primary">

                ✨ Generate Description

            </button>

        </div>

        <!-- Description -->

        <div class="mb-3">

            <label class="form-label">
                Description
            </label>

            <textarea
                id="description"
                name="description"
                rows="6"
                class="form-control"
                required></textarea>

            <div class="form-text">
                You can edit the generated description before posting.
            </div>

        </div>

        <button
            type="submit"
            class="btn btn-success">

            Add Item

        </button>

    </form>

</div>
<script>

document.getElementById("generate-btn").addEventListener("click", async function () {

    const title = document.getElementById("title").value.trim();
    const category = document.getElementById("category").value;
    const price = document.getElementById("price").value;
    const details = document.getElementById("details").value.trim();

    if (!title || !category || !price) {
        alert("Please enter Title, Category and Price first.");
        return;
    }

    const button = document.getElementById("generate-btn");

    button.disabled = true;
    button.innerHTML =
        `<span class="spinner-border spinner-border-sm"></span> Generating...`;

    const formData = new FormData();

    formData.append("title", title);
    formData.append("category", category);
    formData.append("price", price);
    formData.append("details", details);

    try {

        const response = await fetch("/generate-description", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        document.getElementById("description").value = data.description;

    } catch (error) {

        console.error(error);
        alert("Failed to generate description.");

    } finally {

        button.disabled = false;
        button.innerHTML = "✨ Generate Description";

    }

});
</script>

{% endblock %}
